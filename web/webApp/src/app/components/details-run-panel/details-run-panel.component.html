<p-tabs value="run">
  <p-tablist>
    <p-tab value="run">{{ 'details.tabs.run' | t }}</p-tab>
    <p-tab value="history">{{ 'details.tabs.history' | t }}</p-tab>
  </p-tablist>

  <p-tabpanels>
    <p-tabpanel value="run">
      <app-member-selection-list />
      <app-active-run-view />
    </p-tabpanel>

    <p-tabpanel value="history">
      <app-run-history-list [taskCodeFilter]="'run'" />
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
