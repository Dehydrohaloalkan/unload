<mat-card class="stage-card">
    <div class="stage-head">
      <div>
        <h2 class="stage-title">{{ 'runStage.title' | t }}</h2>
      </div>
      @if (lastCompletedAt()) {
        <div class="stage-completed">
          {{ 'runStage.done' | t }}<br />
          <span>{{ formatMoment(lastCompletedAt()!) }}</span>
        </div>
      }
      <i
        class="app-icon stage-icon"
        [class.app-icon--spin]="runBusy()"
        [class.app-icon--spinner]="runBusy()"
        [class.app-icon--check-circle]="!runBusy() && !!lastCompletedAt()"
        [class.app-icon--cancel]="!runBusy() && !lastCompletedAt()"
        [class.stage-icon--spin]="runBusy()"
        [class.stage-icon--success]="!runBusy() && !!lastCompletedAt()"
        [class.stage-icon--danger]="!runBusy() && !lastCompletedAt()"
      ></i>
    </div>

  <div class="stage-body">
    <div class="stage-actions">
      <div class="stage-main-action">
      <button
        mat-flat-button
        type="button"
        class="stage-action-button"
        [disabled]="!canStartRun()"
        [class.stage-button--done]="hasRunToday()"
        [class.pulse-button]="!hasRunToday() && canStartRun()"
        (click)="handleStartRunClick()"
      >
        <span
          class="app-icon"
          [class.app-icon--play]="!runBusy()"
          [class.app-icon--spinner]="runBusy()"
          [class.app-icon--spin]="runBusy()"
          aria-hidden="true"
        ></span>
        {{ 'runStage.runButton' | t }}
      </button>
      </div>
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="'app.more' | t"
        (click)="openDetails.emit()"
      >
        <span class="app-icon app-icon--arrow-forward" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</mat-card>
