<mat-card
  class="clock-card"
  [class.clock-card--online]="connected()"
  [class.clock-card--offline]="!connected()"
  [matTooltip]="connected() ? ('liveClock.tooltipConnected' | t) : ('liveClock.tooltipOffline' | t)"
  matTooltipPosition="above"
>
    <div class="clock-head">
      <div>
        <h2 class="clock-title">{{ 'liveClock.title' | t }}</h2>
      </div>
      <div class="clock-status">
        <i
          class="app-icon"
          [class.app-icon--check-circle]="probeCompleted()"
          [class.app-icon--cancel]="!probeCompleted()"
          [class.status-icon--success]="probeCompleted()"
          [class.status-icon--danger]="!probeCompleted()"
        ></i>
      </div>
    </div>

  <div class="clock-body">
    <div class="clock-value">{{ formatTime(now()) }}</div>
    <div class="clock-window-summary">
      {{ dayWindowSummary() }}
    </div>
  </div>
</mat-card>
