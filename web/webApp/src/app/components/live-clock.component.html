<p-card
  [styleClass]="connected() ? 'clock-card clock-card--online' : 'clock-card clock-card--offline'"
  [pTooltip]="connected() ? ('liveClock.tooltipConnected' | t) : ('liveClock.tooltipOffline' | t)"
  tooltipPosition="top"
>
  <ng-template #header>
    <div class="clock-head">
      <div>
        <h2 class="clock-title">{{ 'liveClock.title' | t }}</h2>
      </div>
      <div class="clock-status">
        @if (completedAt()) {
          <div class="clock-status__completed">{{ formatTimeFromIso(completedAt()!) }}</div>
        }
        <i
          class="app-icon"
          [class.app-icon--check-circle]="probeCompleted()"
          [class.app-icon--cancel]="!probeCompleted()"
          [class.status-icon--success]="probeCompleted()"
          [class.status-icon--danger]="!probeCompleted()"
        ></i>
      </div>
    </div>
  </ng-template>

  <div class="clock-body">
    <div class="clock-value">{{ formatTime(now()) }}</div>
    <div class="clock-window-summary">
      {{ dayWindowSummary() }}
    </div>
  </div>
</p-card>
