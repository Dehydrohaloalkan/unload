<mat-card class="stage-card">
    <div class="stage-head">
      <div>
        <h2 class="stage-title">{{ 'preset.title' | t }}</h2>
      </div>
      @if (completedAt()) {
        <div class="stage-completed">
          {{ 'preset.done' | t }}<br />
          <span>{{ formatMoment(completedAt()!) }}</span>
        </div>
      }
      <i [class]="statusIconClass()"></i>
    </div>

  <div class="stage-body">
    @if (presetTask().running) {
      <div class="stage-running">
        <mat-spinner diameter="20" aria-label="Выполняется"></mat-spinner>
        <span>{{ 'preset.running' | t }}</span>
      </div>
    } @else {
      <div class="stage-actions">
        <div class="stage-main-action">
        <button
          mat-flat-button
          type="button"
          class="stage-action-button"
          [disabled]="!canRunPreset()"
          [class.stage-button--done]="!!completedAt()"
          [class.preset-pulse-button]="!completedAt() && canRunPreset()"
          (click)="onStartClick()"
        >
          <span class="app-icon app-icon--play" aria-hidden="true"></span>
          {{ 'preset.runButton' | t }}
        </button>
        </div>
        <button
          mat-icon-button
          type="button"
          [attr.aria-label]="'app.more' | t"
          (click)="openDetails.emit()"
        >
          <span class="app-icon app-icon--arrow-forward" aria-hidden="true"></span>
        </button>
      </div>
    }
  </div>
</mat-card>
