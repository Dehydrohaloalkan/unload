<p-card styleClass="stage-card">
  <ng-template #header>
    <div class="stage-head">
      <div>
        <h2 class="stage-title">4. Extra</h2>
      </div>
      @if (lastCompletedAt()) {
        <div class="stage-completed">
          Выполнено<br />
          <span>{{ completedLabel() }}</span>
        </div>
      }
      <i
        class="app-icon stage-icon"
        [class.app-icon--spin]="task().running"
        [class.app-icon--spinner]="task().running"
        [class.app-icon--check-circle]="!task().running && !!lastCompletedAt()"
        [class.app-icon--cancel]="!task().running && !lastCompletedAt()"
        [class.stage-icon--spin]="task().running"
        [class.stage-icon--success]="!task().running && !!lastCompletedAt()"
        [class.stage-icon--danger]="!task().running && !lastCompletedAt()"
      ></i>
    </div>
  </ng-template>

  <div class="stage-body">
    <div class="stage-actions">
      <div class="stage-main-action">
      <p-button
        label="Запустить extra"
        icon="app-icon app-icon--bolt"
        size="small"
        [fluid]="true"
        [disabled]="!canRun()"
        [styleClass]="hasRunToday() ? 'stage-button--done' : 'pulse-button'"
        (onClick)="handleStartClick()"
      />
      </div>
      <p-button
        icon="app-icon app-icon--arrow-forward"
        [rounded]="true"
        [outlined]="true"
        severity="secondary"
        [attr.aria-label]="'Подробнее'"
        (onClick)="openDetails.emit()"
      />
    </div>
  </div>
</p-card>
<p-confirmdialog [style]="{ width: '28rem', maxWidth: '92vw' }"></p-confirmdialog>
