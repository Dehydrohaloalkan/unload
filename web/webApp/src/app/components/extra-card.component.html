<mat-card class="stage-card">
    <div class="stage-head">
      <div>
        <h2 class="stage-title">{{ 'extraStage.title' | t }}</h2>
      </div>
      @if (lastCompletedAt()) {
        <div class="stage-completed">
          {{ 'extraStage.done' | t }}<br />
          <span>{{ completedLabel() }}</span>
        </div>
      }
      <i
        class="app-icon stage-icon"
        [class.app-icon--spin]="task().running"
        [class.app-icon--spinner]="task().running"
        [class.app-icon--check-circle]="!task().running && !!lastCompletedAt()"
        [class.app-icon--cancel]="!task().running && !lastCompletedAt()"
        [class.stage-icon--spin]="task().running"
        [class.stage-icon--success]="!task().running && !!lastCompletedAt()"
        [class.stage-icon--danger]="!task().running && !lastCompletedAt()"
      ></i>
    </div>

  <div class="stage-body">
    <div class="stage-actions">
      <div class="stage-main-action">
      <button
        mat-flat-button
        type="button"
        class="stage-action-button"
        [disabled]="!canRun() || task().running"
        [class.stage-button--done]="hasRunToday()"
        [class.pulse-button]="!hasRunToday() && canRun() && !task().running"
        (click)="handleStartClick()"
      >
        <span
          class="app-icon"
          [class.app-icon--bolt]="!task().running"
          [class.app-icon--spinner]="task().running"
          [class.app-icon--spin]="task().running"
          aria-hidden="true"
        ></span>
        {{ 'extraStage.runButton' | t }}
      </button>
      </div>
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="'app.more' | t"
        (click)="openDetails.emit()"
      >
        <span class="app-icon app-icon--arrow-forward" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</mat-card>
